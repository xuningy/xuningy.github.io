# Publications. Entries render via _includes/paper.html.
# - `selected: true` shows the entry on the home page; papers.md lists everything.
# - `highlight: true` renders the entry on a soft tinted card.
# - `status` adds a gray pill after the venue, e.g. "In submission to ICLR 2027".
# - Put a trailing "*" on a name for equal-contribution marks and explain it in `note`.
# - `thumb` is an image path under the site root; `video` is an mp4 path (thumb then acts as poster).
#   Omit both to render a text placeholder.

- key: astranomy26
  title: "Astranomy: An Empirical Study of GPT-6 Astra as a Native Robot Policy"
  url: https://research.nvidia.com/labs/srl/projects/astranomy/
  authors: [Jenai Xuning Yang, Ashna Khetan, Shun Zhang]
  venue: Tech Report 2026
  video: assets/papers/astra.mp4
  thumb: assets/papers/astra.jpg
  links:
    - {label: project, url: https://research.nvidia.com/labs/srl/projects/astranomy/}
    - {label: gallery, url: https://research.nvidia.com/labs/srl/projects/astranomy/gallery.html}
  description: >-
    Can a general-purpose frontier model act as a robot policy with no robot-specific finetuning? We
    test GPT-6 Astra in three roles on RoboLab-120: generating actions directly, running as an agent in
    a persistent coding session, and monitoring a separate robot foundation model. The agentic setup
    reaches 74.8% success but at far higher token cost, and direct inference is slow at about 18.6
    seconds per call.
  selected: true

- key: arc26
  title: "ARC: A Reasoning Recipe for Robot Foundation Models"
  url: https://arc-robot-reasoning.github.io/
  authors: [Gokul Puthumanaillam, Tao Sun, Elie Aljalbout, Moritz Reuss, Zhaoshuo Li, Fabio Ramos, "Ankit Goyal*", "Jenai Xuning Yang*"]
  note: "* equal advising"
  venue: arXiv 2026
  status: In submission to ICLR 2027
  highlight: true
  video: assets/papers/arc.mp4
  thumb: assets/papers/arc-poster.jpg
  links:
    - {label: paper, url: https://arc-robot-reasoning.github.io/assets/paper/arc-paper.pdf}
    - {label: project, url: https://arc-robot-reasoning.github.io/}
  description: >-
    ARC improves robot foundation models by grounding reasoning in the robot's next action and its
    expected effects. It automatically labels existing demonstrations with reasoning traces and adapts
    pretrained policies to use them, achieving state-of-the-art results on RoboLab-120 and MolmoSpaces
    without new robot demonstrations or foundation-scale training.
  selected: true

- key: robolab26
  title: "RoboLab: A High-Fidelity Simulation Benchmark for Analysis of Task Generalist Policies"
  url: https://research.nvidia.com/labs/srl/projects/robolab/
  authors: [Jenai Xuning Yang, Rishit Dagli, Alex Zook, Hugo Hadfield, Ankit Goyal, Stan Birchfield, Fabio Ramos, Jonathan Tremblay]
  venue: RSS 2026
  highlight: true
  video: assets/papers/robolab.mp4
  thumb: assets/papers/robolab.jpg
  links:
    - {label: paper, url: https://arxiv.org/pdf/2604.09860}
    - {label: code, url: https://github.com/NVlabs/RoboLab/}
    - {label: project, url: https://research.nvidia.com/labs/srl/projects/robolab/}
    - {label: bibtex, url: bibtex/robolab26.txt}
  description: >-
    RoboLab is a high-fidelity simulation platform for evaluating robot policies trained on real-world
    data. Fast scene and task generation keeps the benchmark from saturating, and the 120-task suite
    separately measures visual, relational, and procedural generalization.
  selected: true

- key: cosmos3
  title: "Cosmos 3: Omnimodal World Models for Physical AI"
  url: https://research.nvidia.com/labs/cosmos-lab/cosmos3/
  authors: [NVIDIA Cosmos3 Team]
  venue: arXiv 2026
